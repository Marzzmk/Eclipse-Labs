<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Eclipse Labs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav>
        <a href="index.html#inicio">Inicio</a>
        <a href="index.html#nosotros">Sobre nosotros</a>
        <a href="index.html#servicios">Servicios</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main class="pagina-interna">
        <section class="contacto animado" id="contacto">
            <h2>Contáctanos</h2>
            <p class="intro-pagina">¿Tienes una idea, una duda o quieres jugar con nosotros? Escríbenos.</p>

            <form id="form-contacto" class="formulario">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="¿Sobre qué quieres hablar?" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje aquí..." required></textarea>

                <button type="submit" class="boton">Enviar mensaje</button>
                <p id="aviso-form" class="aviso-form"></p>
            </form>
        </section>
    </main>

    <footer class="pie-de-pagina" id="footer">
        <div>
            <h2>Eclipse Labs</h2>
            <p>Innovación que se juega</p>
            <h2>Contacto</h2>
            <a href="mailto:eclipselabs@gmail.com">eclipselabs@gmail.com</a>
            <a href="https://eclipselabs.com">eclipselabs.com</a>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
